# Run from the repo root. `task` lists the tasks.
# Each starter also works alone: every command here is one you can type yourself
# inside that directory.
version: "3"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  setup:
    desc: "Install the dependencies of every starter"
    cmds:
      - for: [python, fastapi]
        task: uv-sync
        vars: { DIR: "{{.ITEM}}" }
      - for: [react, next]
        task: pnpm-install
        vars: { DIR: "{{.ITEM}}" }
      - task: setup:haskell
      - task: setup:rust
      - task: setup:go
      - task: setup:erlang
      - task: setup:elixir

  api:
    desc: "fastapi on http://127.0.0.1:8000/docs"
    dir: fastapi
    cmds:
      - uv run fastapi dev {{.CLI_ARGS}}

  react:
    desc: "react on http://localhost:5173 (sends /api to :8000)"
    dir: react
    cmds:
      - pnpm dev {{.CLI_ARGS}}

  next:
    desc: "next on http://localhost:3000 (sends /api to :8000)"
    dir: next
    cmds:
      - pnpm dev {{.CLI_ARGS}}

  dev:
    desc: "fastapi + react together"
    deps: [api, react]

  dev:next:
    desc: "fastapi + next together"
    deps: [api, next]

  check:
    desc: "Lint, format check, type check and tests of every starter"
    cmds:
      - for: [python, fastapi]
        task: check-python
        vars: { DIR: "{{.ITEM}}" }
      - for: [react, next]
        task: check-js
        vars: { DIR: "{{.ITEM}}" }
      - task: check:haskell
      - task: check:rust
      - task: check:go
      - task: check:erlang
      - task: check:elixir

  setup:haskell:
    desc: "Download Haskell dependencies"
    dir: haskell
    cmds:
      - cabal build all --only-download

  setup:rust:
    desc: "Download Rust dependencies"
    dir: rust
    cmds:
      - cargo fetch --locked

  setup:go:
    desc: "Download Go dependencies"
    dir: go
    cmds:
      - go mod download

  setup:erlang:
    desc: "Download Erlang dependencies and plugins"
    dir: erlang
    cmds:
      - rebar3 get-deps

  setup:elixir:
    desc: "Download Elixir dependencies"
    dir: elixir
    cmds:
      - mix deps.get

  check:haskell:
    desc: "Format, build and test Haskell"
    dir: haskell
    cmds:
      - fourmolu --mode check app src test
      - cabal build all --ghc-options=-Werror
      - cabal test all
      - cabal check

  check:rust:
    desc: "Format, lint and test Rust"
    dir: rust
    cmds:
      - cargo fmt --all --check
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo test --locked

  check:go:
    desc: "Format, vet and test Go"
    dir: go
    cmds:
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test -race ./...

  check:erlang:
    desc: "Format, analyze and test Erlang"
    dir: erlang
    cmds:
      - rebar3 check

  check:elixir:
    desc: "Format, compile and test Elixir"
    dir: elixir
    cmds:
      - mix format --check-formatted
      - mix compile --warnings-as-errors
      - mix test

  uv-sync:
    internal: true
    label: "uv-sync:{{.DIR}}"
    dir: "{{.DIR}}"
    cmds:
      - uv sync

  pnpm-install:
    internal: true
    label: "pnpm-install:{{.DIR}}"
    dir: "{{.DIR}}"
    cmds:
      - pnpm install --frozen-lockfile

  check-python:
    internal: true
    label: "check:{{.DIR}}"
    dir: "{{.DIR}}"
    cmds:
      - uv run ruff check
      - uv run ruff format --check
      - uv run mypy
      - uv run pytest -q

  check-js:
    internal: true
    label: "check:{{.DIR}}"
    dir: "{{.DIR}}"
    cmds:
      - pnpm check
