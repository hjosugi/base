[project]
name = "pythonbase"
version = "0.1.0"
description = "Python starter: uv, Ruff, mypy, pytest, pre-commit."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
# `uv run pythonbase README.md` calls pythonbase.cli:main.
pythonbase = "pythonbase.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# Ruff: linter + formatter
# target-version is taken from requires-python.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
src = ["src", "tests"]
# Ruff also formats code blocks in Markdown.
# README snippets are short excerpts, so we skip them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez (naive datetime)
    "T10",   # flake8-debugger (left-over breakpoint())
    "T20",   # flake8-print (left-over print())
    "S",     # flake8-bandit (security)
    "PT",    # flake8-pytest-style
    "RUF",   # Ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# assert is the normal way to check things in pytest.
"tests/**" = ["S101"]
# The command line tool prints its result.
"src/pythonbase/cli.py" = ["T201"]

# ---------------------------------------------------------------------------
# mypy: static type checker (strict mode)
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
files = ["src", "tests"]

# ---------------------------------------------------------------------------
# pytest + coverage
# [tool.pytest] (native TOML types) needs pytest 9.0 or later.
# ---------------------------------------------------------------------------
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=pythonbase",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_also = ['if __name__ == "__main__":']

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
